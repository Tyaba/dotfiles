"~/.cursor" = { source = "config/coding_agents/cursor", mode = "symlink-each", exclude = ["*.erb", "state"] }
"~/.claude/skills" = { source = "config/coding_agents/skills", mode = "symlink-each", exclude = ["synced"] }
"~/.cursor/skills" = { source = "config/coding_agents/skills", mode = "symlink-each", exclude = ["synced"] }
"~/.claude/hooks" = { source = "config/coding_agents/hooks", mode = "symlink-each", exclude = ["herdr-agent-state.sh", "state", "__pycache__"] }
"~/.cursor/hooks" = { source = "config/coding_agents/hooks", mode = "symlink-each", exclude = ["herdr-agent-state.sh", "state", "__pycache__"] }
"~/.claude/user-rules.md" = { source = "config/coding_agents/user-rules.md" }
"~/.local/bin/claude-sync-mcp" = { source = "config/coding_agents/sync-claude-user-mcp.sh" }
"~/.local/bin/codex-link-auth" = { source = "config/coding_agents/codex/link-auth.sh" }
"~/.cargo/config.toml" = { source = "config/.cargo/config.toml" }
"~/.config/boto" = { source = "config/.config/boto" }
"~/.config/sheldon" = { source = "config/.config/sheldon" }
"~/.zsh" = { source = "config/.zsh" }
"~/.zshrc" = { source = "config/.zshrc" }
