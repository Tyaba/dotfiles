"~/.config/ghostty" = { source = "config/.config/ghostty", variants = [{ os = "macos" }] }
"~/.config/karabiner" = { source = "config/.config/karabiner", variants = [{ os = "macos" }] }
"~/.config/mise/config.toml" = { source = "config/mise/config.toml" }
