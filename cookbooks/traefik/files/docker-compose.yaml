services:
  traefik:
    image: traefik:v3.7
    container_name: tyaba-proxy-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yaml
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      # Bind-mount sources are resolved by the Docker daemon filesystem, not by the host CLI.
      # Use the daemon-local socket path; host-side Colima socket forwarders are not valid mount sources.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ./certs:/certs:ro
    networks:
      - tyaba-proxy

networks:
  tyaba-proxy:
    external: true
    name: tyaba-proxy
